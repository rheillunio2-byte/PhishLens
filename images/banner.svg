
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">PhishLens — See Beyond the Link</title>
  <desc id="desc">A cybersecurity-themed banner with a glowing lens and URL analysis motifs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080E1C"></stop>
      <stop offset="0.55" stop-color="#101B35"></stop>
      <stop offset="1" stop-color="#17112F"></stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38BDF8"></stop>
      <stop offset="0.55" stop-color="#818CF8"></stop>
      <stop offset="1" stop-color="#C084FC"></stop>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#38BDF8" stop-opacity=".22"></stop>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"></stop>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="18"></feGaussianBlur>
    </filter>
  </defs>

  <rect width="1200" height="340" rx="24" fill="url(#bg)"></rect>
  <circle cx="960" cy="150" r="190" fill="url(#glow)" filter="url(#blur)"></circle>

  <g fill="none" stroke="#64748B" opacity=".15">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200"></path>
    <path d="M100 0V340M200 0V340M300 0V340M400 0V340M500 0V340M600 0V340M700 0V340M800 0V340M900 0V340M1000 0V340M1100 0V340"></path>
  </g>

  <g transform="translate(890 72)">
    <circle cx="95" cy="85" r="73" fill="#0D1830" stroke="url(#accent)" stroke-width="5"></circle>
    <circle cx="95" cy="85" r="52" fill="none" stroke="#38BDF8" stroke-width="2" opacity=".5"></circle>
    <path d="M137 137L194 194" stroke="url(#accent)" stroke-width="17" stroke-linecap="round"></path>
    <path d="M69 85L88 104L126 62" fill="none" stroke="#67E8F9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"></path>
    <circle cx="95" cy="85" r="39" fill="#38BDF8" opacity=".08"></circle>
  </g>

  <g fill="#38BDF8" opacity=".7">
    <circle cx="825" cy="72" r="3"></circle><circle cx="1090" cy="70" r="4"></circle>
    <circle cx="1100" cy="260" r="3"></circle><circle cx="840" cy="260" r="4"></circle>
  </g>

  <rect x="72" y="72" width="106" height="30" rx="15" fill="#12314B" stroke="#38BDF8" stroke-opacity=".4"></rect>
  <text x="125" y="92" text-anchor="middle" fill="#7DD3FC" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">URL INTELLIGENCE</text>

  <text x="68" y="177" fill="#F8FAFC" font-family="Arial,sans-serif" font-size="72" font-weight="800" letter-spacing="-3">Phish<tspan fill="url(#accent)">Lens</tspan></text>
  <text x="74" y="218" fill="#C7D2FE" font-family="Arial,sans-serif" font-size="25" letter-spacing="5">SEE BEYOND THE LINK.</text>
  <text x="74" y="267" fill="#94A3B8" font-family="Arial,sans-serif" font-size="17">Inspect suspicious patterns. Understand the signals. Think before you click.</text>

  <path d="M72 302H1128" stroke="url(#accent)" stroke-width="2" opacity=".6"></path>
  <circle cx="72" cy="302" r="4" fill="#38BDF8"></circle>
  <circle cx="1128" cy="302" r="4" fill="#C084FC"></circle>
</svg>
