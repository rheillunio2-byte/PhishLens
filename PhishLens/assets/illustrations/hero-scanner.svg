<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="A magnifying lens scanning a suspicious link in front of a shield"><title>Lens scanning a suspicious link</title>
<style>.r{transform-origin:240px 190px;animation:s 60s linear infinite}.l{animation:p 7s ease-in-out infinite alternate}.n{animation:b 3s ease-in-out infinite}.beam{animation:v 2.4s ease-in-out infinite alternate}@keyframes s{to{transform:rotate(360deg)}}@keyframes p{from{transform:translateX(-95px)}to{transform:translateX(55px)}}@keyframes b{50%{opacity:.25}}@keyframes v{from{transform:translateY(-52px)}to{transform:translateY(52px)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38BDF8"/><stop offset="1" stop-color="#818CF8"/></linearGradient><clipPath id="c"><circle cx="0" cy="0" r="52"/></clipPath></defs>
<g class="r" fill="none" stroke="#38BDF8" stroke-opacity=".25"><circle cx="240" cy="190" r="185" stroke-dasharray="3 9"/><circle cx="240" cy="190" r="140" stroke="#818CF8" stroke-dasharray="40 14"/></g>
<g stroke="#38BDF8" stroke-opacity=".3"><path d="M60 120 120 80 90 30M420 90 380 40M440 200 400 270M50 250 20 300"/></g>
<g fill="#38BDF8"><circle class="n" cx="60" cy="120" r="4"/><circle class="n" cx="120" cy="80" r="3"/><circle class="n" cx="380" cy="40" r="4"/><circle class="n" cx="400" cy="270" r="3"/><circle class="n" cx="20" cy="300" r="3"/></g>
<path d="M240 30 370 78V170C370 250 310 305 240 340 170 305 110 250 110 170V78Z" fill="#38BDF8" fill-opacity=".07" stroke="url(#a)" stroke-width="3"/>
<g transform="translate(40 250)"><rect width="400" height="56" rx="28" fill="#111C30" stroke="#38BDF8" stroke-opacity=".35"/><circle cx="28" cy="28" r="7" fill="#F87171"/><text x="48" y="34" font-family="IBM Plex Mono,Consolas,monospace" font-size="16" fill="#94A3B8">https://<tspan fill="#F8FAFC">paypa1-verify.top</tspan>/login</text><rect x="106" y="40" width="108" height="3" rx="1.5" fill="#F87171"/></g>
<g class="l"><g transform="translate(285 215)"><circle r="62" fill="#0D1424" fill-opacity=".55"/><g clip-path="url(#c)"><rect class="beam" x="-52" y="-2" width="104" height="4" fill="#38BDF8"/></g><circle r="62" fill="none" stroke="url(#a)" stroke-width="7"/><path d="M45 45 85 85" stroke="url(#a)" stroke-width="9" stroke-linecap="round"/></g></g></svg>